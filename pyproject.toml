[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papercleaner"
version = "0.1.0"
description = "Clean LaTeX paper sources safely"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
papercleaner = "papercleaner.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/papercleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
